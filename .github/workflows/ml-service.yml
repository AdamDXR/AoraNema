name: ML Service Code Check

on:
  push:
    branches:
      - main
      - 'ml/**' # Hanya menyala jika ada push ke branch berawalan ml/

jobs:
  test-ml:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          # Pastikan Anda memiliki file requirements.txt di folder ml-service
          pip install -r requirements.txt