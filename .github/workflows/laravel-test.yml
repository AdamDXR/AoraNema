name: Backend Code Check

# Robot menyala saat ada push ke main, dan saat ada pull request menuju main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-laravel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # composer.lock saat ini menuntut minimal PHP 8.4.1

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Frontend ikut dibangun. Layout memanggil @vite, dan Laravel mencari
      # public/build/manifest.json. Tanpa langkah ini, tes yang membuka halaman gagal.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Tests
        run: php artisan test
